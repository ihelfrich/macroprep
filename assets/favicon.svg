<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="8" fill="#0d3b66"/>
  <!-- supply curve (upward sloping) -->
  <line x1="12" y1="52" x2="52" y2="14" stroke="#faf8f3" stroke-width="3" stroke-linecap="round"/>
  <!-- demand curve (downward sloping) -->
  <line x1="12" y1="14" x2="52" y2="52" stroke="#d4a72c" stroke-width="3" stroke-linecap="round"/>
  <!-- equilibrium dot -->
  <circle cx="32" cy="33" r="4" fill="#b85c38" stroke="#faf8f3" stroke-width="1.5"/>
</svg>
